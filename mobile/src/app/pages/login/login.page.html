<ion-content>
  <div class="login-wrap">
    <div class="brand">
      <img src="assets/logo.png" alt="Logo de Antojería Pingüin" />
      <h1>Antojería Pingüin</h1>
      <p>App de meseros</p>
    </div>

    <form class="card form" (ngSubmit)="submit()" novalidate>
      @if (expired()) {
        <ion-note class="notice">Tu sesión expiró. Inicia sesión de nuevo.</ion-note>
      }

      <ion-input
        label="Correo electrónico"
        labelPlacement="stacked"
        fill="outline"
        type="email"
        inputmode="email"
        autocomplete="username"
        name="email"
        [(ngModel)]="email"
        data-testid="email"
      ></ion-input>

      <ion-input
        label="Contraseña"
        labelPlacement="stacked"
        fill="outline"
        type="password"
        autocomplete="current-password"
        name="password"
        [(ngModel)]="password"
        data-testid="password"
      >
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      @if (showServer()) {
        <ion-input
          label="Dirección del servidor"
          labelPlacement="stacked"
          fill="outline"
          type="url"
          inputmode="url"
          name="server"
          helperText="Ejemplo: http://192.168.1.50:8000/api/v1"
          [(ngModel)]="serverUrl"
        ></ion-input>
      }
      @if (error()) {
        <p class="error" role="alert" data-testid="login-error">{{ error() }}</p>
      }

      <ion-button type="submit" expand="block" class="button-large" [disabled]="loading()" data-testid="login-submit">
        @if (loading()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Entrar
        }
      </ion-button>

      <ion-button type="button" fill="clear" size="small" color="secondary" (click)="toggleServer()">
        <ion-icon slot="start" name="server-outline"></ion-icon>
        {{ showServer() ? 'Ocultar servidor' : 'Configurar servidor' }}
      </ion-button>
    </form>
  </div>
</ion-content>
