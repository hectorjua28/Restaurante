name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pinguin_test
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pinguin_test
      DB_USERNAME: root
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_sqlite, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Migraciones y seeders en MySQL 8
        run: php artisan migrate:fresh --seed --force

      - name: Pruebas (Pest sobre MySQL 8)
        run: vendor/bin/pest

  mobile:
    name: App móvil (Ionic + Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint y Prettier
        run: npm run lint

      - name: Pruebas unitarias (Vitest)
        run: npm test

      - name: Build de producción
        run: npx ng build --configuration production
