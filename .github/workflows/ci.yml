name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pinguin_test
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pinguin_test
      DB_USERNAME: root
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_sqlite, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Migraciones y seeders en MySQL 8
        run: php artisan migrate:fresh --seed --force

      - name: Pruebas (Pest sobre MySQL 8)
        run: vendor/bin/pest

  mobile:
    name: App móvil (Ionic + Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint y Prettier
        run: npm run lint

      - name: Pruebas unitarias (Vitest)
        run: npm test

      - name: Build de producción
        run: npx ng build --configuration production

  android:
    name: APK de Android (Capacitor)
    runs-on: ubuntu-latest
    needs: mobile
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar la app y sincronizar Android
        run: |
          npm ci
          npm run build:android

      - name: Compilar APK de depuración
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: pinguin-meseros-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  e2e:
    name: Extremo a extremo (Playwright)
    # Playwright 1.56 aún no soporta Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    needs: [web, mobile]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Preparar Laravel
        working-directory: web
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build
          cp .env.example .env
          php artisan key:generate

      - name: Compilar la PWA dentro de Laravel (/app)
        working-directory: mobile
        run: |
          npm ci
          npm run build:pwa

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Flujo completo mesero → cocina → cobro
        working-directory: e2e
        run: npm test

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: e2e/playwright-report
          retention-days: 7
